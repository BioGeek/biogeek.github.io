name: Refresh CV durations

# The CV lists each job's length ("X years Y months"); rendercv computes those
# from start_date/end_date at render time. Every past job has fixed dates and
# never changes, but the current job (end_date: present) grows every month, and
# the committed files/jeroen-van-goey-cv.pdf is otherwise only rebuilt by the
# pre-commit hook when the YAML changes. This re-renders it monthly so the
# "present" duration stays current, and deploys only when a number actually moved.

on:
  schedule:
    # Monthly, the 1st at 06:00 UTC (a month is the smallest unit that can change).
    - cron: "0 6 1 * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: write # commit the refreshed files/jeroen-van-goey-cv.pdf
  pages: write
  id-token: write

# Shared with publish + the other auto-update workflows so renders/deploys/pushes never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Re-render the CV PDF (rendercv recomputes durations as of today)
        run: uv run make cv

      - name: Commit and push the PDF if a duration changed
        id: changes
        run: |
          # rendercv/Typst embeds the render date, so the PDF bytes differ every
          # run even when nothing moved. Compare the visible durations instead, so
          # a commit happens only when a number actually changed.
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          durations() { pdftotext "$1" - | grep -oiE '[0-9]+ (years?|months?)' | tr '\n' ' '; }
          git show HEAD:files/jeroen-van-goey-cv.pdf > /tmp/cv_head.pdf
          old="$(durations /tmp/cv_head.pdf)"; new="$(durations files/jeroen-van-goey-cv.pdf)"
          echo "old durations: $old"; echo "new durations: $new"
          if [ "$new" = "$old" ]; then
            echo "No duration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/jeroen-van-goey-cv.pdf
          git commit -m "chore: refresh CV durations"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed; retrying"; sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not re-trigger publish.yml, so deploy here when
      # something changed. Mirror publish.yml's manual tar so docs/.well-known/
      # survives (actions/upload-pages-artifact would strip dot-directories).
      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          version: 1.9.38

      - name: Render
        if: steps.changes.outputs.changed == 'true'
        run: uv run quarto render

      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'

      - name: Archive Pages artifact (keep dot-dirs like .well-known)
        if: steps.changes.outputs.changed == 'true'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deploy
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
