name: Publish site

# Renders the Quarto site and deploys it to GitHub Pages.
# Pages source must be set to "GitHub Actions" (Settings -> Pages -> Build and deployment).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# All site-touching workflows share this group so renders/deploys never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Render
        run: uv run quarto render

      - uses: actions/configure-pages@v6

      # actions/upload-pages-artifact strips dot-directories (its tar runs
      # `--exclude=.[^/]*`), which drops docs/.well-known/ and 404s the Bluesky
      # handle file. Build the Pages tarball ourselves without that exclusion,
      # then hand deploy-pages the same "github-pages" artifact it expects.
      - name: Archive Pages artifact (keep dot-dirs like .well-known)
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deploy
        uses: actions/deploy-pages@v5
